modLoader="javafml"
loaderVersion="[1,)"
license="CC BY 4.0, with an additional permission for modpacks. See LICENSE."

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Dimensional Flux"
logoFile="logo.png"
description='''Transfer and manage wireless energy across dimensions.'''

# Icon in the mod list of the Catalogue mod.
[modproperties.${mod_id}]
    catalogueImageIcon="icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"
